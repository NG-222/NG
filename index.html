<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>N-LAN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .card {
            max-width: 600px;
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            padding: 3rem 2.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            color: #1a2332;
            margin-bottom: 1.8rem;
        }

        p {
            font-size: 1rem;
            line-height: 1.9;
            color: #2d3a4f;
            margin-bottom: 1rem;
        }

        .tags {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin: 1.5rem 0 2rem;
        }

        .tags span {
            background: #eef2f7;
            padding: 0.2rem 1.2rem;
            border-radius: 30px;
            font-size: 0.9rem;
            color: #2d3a4f;
        }

        .links {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            padding-top: 1.5rem;
            border-top: 1px solid #e8ecf2;
        }

        .links a {
            color: #4a6fa5;
            text-decoration: none;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: right;
            font-size: 0.75rem;
            color: #b0bccf;
            margin-top: 2rem;
        }

        .toast {
            display: none;
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: #1a2332;
            color: #fff;
            padding: 0.6rem 1.8rem;
            border-radius: 30px;
            font-size: 0.9rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            z-index: 999;
        }

        .toast.show {
            display: block;
            animation: fadeInOut 1.5s ease forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>N-LAN</h1>

        <p>你好，我是 N-LAN。这里是我的个人主页喵~</p>
        <p>不知道这里应该写什么</p>

        <div class="tags">
            <span>💻 编程</span>
            <span>🎵 音乐</span>
            <span>🎮 游戏</span>
        </div>

        <div class="links">
            <a href="#" id="githubLink">📋 复制 GitHub</a>
            <a href="#" id="emailLink">📋 复制邮箱</a>
        </div>

        <div class="footer">N-LAN · 2026</div>
    </div>

    <div class="toast" id="toast">✅ 已复制到剪贴板</div>

    <script>
        // GitHub 复制
        document.getElementById('githubLink').addEventListener('click', function(e) {
            e.preventDefault();
            copyText('https://github.com/NG-222');
        });

        // Email 复制
        document.getElementById('emailLink').addEventListener('click', function(e) {
            e.preventDefault();
            copyText('IT-2307@outlook.com');
        });

        function copyText(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast();
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const input = document.createElement('input');
            input.value = text;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
            showToast();
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('show');
            void toast.offsetWidth;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 1800);
        }
    </script>

</body>
</html>
