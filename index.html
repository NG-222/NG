<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>N-LAN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .card {
            max-width: 600px;
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            padding: 3rem 2.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            color: #1a2332;
            margin-bottom: 1.8rem;
        }

        p {
            font-size: 1rem;
            line-height: 1.9;
            color: #2d3a4f;
            margin-bottom: 1rem;
        }

        .tags {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin: 1.5rem 0 2rem;
        }

        .tags span {
            background: #eef2f7;
            padding: 0.2rem 1.2rem;
            border-radius: 30px;
            font-size: 0.9rem;
            color: #2d3a4f;
        }

        .links {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            padding-top: 1.5rem;
            border-top: 1px solid #e8ecf2;
        }

        .links a {
            color: #4a6fa5;
            text-decoration: none;
            font-size: 0.95rem;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: right;
            font-size: 0.75rem;
            color: #b0bccf;
            margin-top: 2rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>N-LAN</h1>

        <p>你好，我是 N-LAN。这里是我的个人主页。</p>
        <p>相信简单即是美好，喜欢安静地写点东西，偶尔研究感兴趣的技术。</p>

        <div class="tags">
            <span>💻 编程</span>
            <span>🎵 音乐</span>
            <span>🎮 游戏</span>
        </div>

        <div class="links">
            <a href="#">GitHub</a>
            <a href="#">Email</a>
        </div>

        <div class="footer">N-LAN · 2026</div>
    </div>

</body>
</html>
