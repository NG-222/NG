<style>

/* =========================================================
   1. 设计变量
   ---------------------------------------------------------
   想换整体色调，改这里的颜色就行，全站跟着变。
   ========================================================= */

:root{
    --bg:            #080b12;

    --accent:        #5fd0ff;
    --accent-2:      #a47bff;

    --text:          #f2f6fb;
    --text-soft:     rgba(232,240,252,.72);
    --text-mute:     rgba(232,240,252,.46);
    --text-faint:    rgba(232,240,252,.3);

    --glass:         rgba(255,255,255,.045);
    --glass-2:       rgba(255,255,255,.07);
    --line:          rgba(255,255,255,.1);
    --line-2:        rgba(255,255,255,.18);

    --shadow:        0 24px 60px -24px rgba(0,0,0,.85);
    --ring:          0 0 0 3px rgba(95,208,255,.28);

    --radius:        20px;
    --radius-sm:     14px;

    --maxw:          1080px;
}


/* =========================================================
   2. 基础重置
   ========================================================= */

*,
*::before,
*::after{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;

    /* 锚点跳转时给吸顶导航留出空间 */
    scroll-padding-top:110px;

    -webkit-text-size-adjust:100%;
}

body{
    min-height:100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Hiragino Sans GB",
        "Microsoft YaHei",
        system-ui,
        sans-serif;

    font-size:16px;
    line-height:1.75;

    color:var(--text);
    background:var(--bg);

    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;

    overflow-x:hidden;
}

img{
    display:block;
    max-width:100%;
}

a{
    color:inherit;
    text-decoration:none;
}

button{
    font:inherit;
    color:inherit;
    background:none;
    border:none;
    cursor:pointer;
}

::selection{
    background:rgba(95,208,255,.3);
    color:#fff;
}

/* 键盘导航的焦点圈 */

:focus-visible{
    outline:none;
    box-shadow:var(--ring);
    border-radius:8px;
}

/* 无障碍隐藏 */

.sr{
    position:absolute;
    width:1px;
    height:1px;
    padding:0;
    margin:-1px;
    overflow:hidden;
    clip:rect(0 0 0 0);
    white-space:nowrap;
    border:0;
}


/* =========================================================
   3. 背景：三团缓慢流动的光晕 + 细网格
   ========================================================= */

.bg{
    position:fixed;
    inset:0;

    z-index:-1;

    overflow:hidden;

    pointer-events:none;

    background:var(--bg);
}

/* 光晕 */

.bg::before{
    content:"";

    position:absolute;
    inset:-25%;

    background:
        radial-gradient(42% 38% at 16% 16%, rgba(46,150,238,.62), transparent 66%),
        radial-gradient(36% 34% at 86% 10%, rgba(148,104,246,.54), transparent 66%),
        radial-gradient(46% 42% at 64% 92%, rgba(32,186,180,.42), transparent 68%);

    filter:blur(72px);

    animation:drift 34s ease-in-out infinite alternate;

    will-change:transform;
}

@keyframes drift{

    0%{
        transform:translate3d(-3%,-2%,0) scale(1);
    }

    50%{
        transform:translate3d(3%,2%,0) scale(1.14);
    }

    100%{
        transform:translate3d(-1%,3%,0) scale(1.04);
    }
}

/* 细网格 + 四角压暗，让中间的内容浮起来 */

.bg::after{
    content:"";

    position:absolute;
    inset:0;

    background:
        radial-gradient(130% 105% at 50% 42%, transparent 42%, rgba(8,11,18,.72) 100%),
        linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);

    background-size:auto, 64px 64px, 64px 64px;

    mask-image:radial-gradient(125% 80% at 50% 32%, #000 26%, transparent 92%);
    -webkit-mask-image:radial-gradient(125% 80% at 50% 32%, #000 26%, transparent 92%);
}


/* =========================================================
   4. 布局骨架
   ========================================================= */

.wrap{
    width:100%;
    max-width:var(--maxw);

    margin:0 auto;

    padding:0 24px;
}

section{
    padding:96px 0;
}


/* =========================================================
   5. 顶部导航（吸顶 + 玻璃）
   ========================================================= */

/* 整宽条，未滚动时完全透明，滚动后由 .on 打开玻璃底 */

.nav{
    position:fixed;
    top:0;
    left:0;
    right:0;

    z-index:100;

    border-bottom:1px solid transparent;

    transition:background .35s ease,border-color .35s ease;
}

.nav.on{
    background:rgba(8,11,18,.7);

    border-bottom-color:var(--line);

    backdrop-filter:blur(20px) saturate(1.6);
    -webkit-backdrop-filter:blur(20px) saturate(1.6);
}

/* 内层居中，内容不会撑到屏幕两边 */

.nav-inner{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;

    max-width:var(--maxw);
    margin:0 auto;

    padding:14px 24px;
}

/* 菜单真正居中 */

.nav-inner > nav{
    grid-column:2;
}

.logo{
    justify-self:start;

    display:inline-flex;
    align-items:center;
    gap:9px;

    font-size:15px;
    font-weight:700;
    letter-spacing:.2px;
}

.logo .dot{
    width:9px;
    height:9px;

    border-radius:50%;

    background:var(--accent);

    box-shadow:0 0 14px var(--accent);

    animation:pulse 2.6s ease-in-out infinite;
}

@keyframes pulse{

    0%,100%{
        opacity:1;
        transform:scale(1);
    }

    50%{
        opacity:.45;
        transform:scale(.82);
    }
}

.nav ul{
    display:flex;
    gap:4px;

    list-style:none;
}

.nav ul a{
    display:block;

    padding:8px 14px;

    font-size:13.5px;

    color:var(--text-mute);

    border-radius:99px;

    transition:color .22s ease,background .22s ease;
}

.nav ul a:hover{
    color:var(--text);
    background:var(--glass);
}

.nav ul a.active{
    color:var(--text);
    background:var(--glass-2);
}


/* =========================================================
   6. 首屏
   ========================================================= */

.hero{
    display:grid;
    align-content:center;

    min-height:100vh;
    min-height:100svh;

    padding-top:120px;
}

.hero-inner{
    max-width:760px;
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:9px;

    padding:6px 15px 6px 12px;

    margin-bottom:28px;

    font-size:12.5px;
    letter-spacing:.4px;

    color:var(--text-soft);

    border:1px solid var(--line);
    border-radius:99px;

    background:var(--glass);

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
}

.badge .led{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#42e08b;
    box-shadow:0 0 10px #42e08b;
}

h1{
    font-size:clamp(40px,7.4vw,74px);
    font-weight:800;
    letter-spacing:-2.4px;
    line-height:1.06;

    margin-bottom:22px;
}

/* 渐变文字 */

.grad{
    background:linear-gradient(100deg,var(--accent) 0%,var(--accent-2) 62%,#ff8fc7 100%);

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
    -webkit-text-fill-color:transparent;
}

/* 打字的副标题 */

.typed{
    min-height:1.8em;

    font-size:clamp(16px,2.3vw,21px);
    font-weight:500;

    color:var(--text-soft);

    margin-bottom:20px;
}

.caret{
    display:inline-block;

    width:2px;
    height:1.05em;

    margin-left:3px;

    vertical-align:-.16em;

    background:var(--accent);

    animation:blink 1.05s step-end infinite;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}

.hero p.lead{
    max-width:60ch;

    font-size:16.5px;

    color:var(--text-soft);

    margin-bottom:36px;
}

.hero p.lead strong{
    color:var(--text);
    font-weight:600;
}


/* =========================================================
   7. 按钮
   ========================================================= */

.btns{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
}

.btn{
    position:relative;

    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;

    height:48px;
    padding:0 26px;

    font-size:14.5px;
    font-weight:600;

    border-radius:99px;

    border:1px solid var(--line-2);

    overflow:hidden;

    transition:transform .22s cubic-bezier(.34,1.56,.64,1),border-color .22s ease,background .22s ease,box-shadow .22s ease;
}

.btn svg{
    width:17px;
    height:17px;

    flex:none;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn:active{
    transform:translateY(0) scale(.98);
}

/* 主按钮：渐变实心 */

.btn.primary{
    color:#04131c;

    border-color:transparent;

    background:linear-gradient(100deg,var(--accent),var(--accent-2));

    box-shadow:0 12px 34px -12px rgba(95,208,255,.75);
}

.btn.primary:hover{
    box-shadow:0 18px 44px -12px rgba(95,208,255,.9);
}

/* 次按钮：玻璃 */

.btn.ghost{
    color:var(--text-soft);

    background:var(--glass);

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
}

.btn.ghost:hover{
    color:var(--text);
    background:var(--glass-2);
    border-color:var(--line-2);
}


/* =========================================================
   8. 区块标题
   ========================================================= */

.sec-head{
    margin-bottom:48px;
}

.sec-kicker{
    display:flex;
    align-items:center;
    gap:12px;

    font-size:12px;
    font-weight:600;
    letter-spacing:2.6px;
    text-transform:uppercase;

    color:var(--accent);

    margin-bottom:14px;
}

.sec-kicker::before{
    content:"";

    width:26px;
    height:1px;

    background:var(--accent);

    opacity:.65;
}

.sec-head h2{
    font-size:clamp(28px,4vw,40px);
    font-weight:750;
    letter-spacing:-1.1px;
    line-height:1.2;

    margin-bottom:12px;
}

.sec-head p{
    max-width:62ch;

    font-size:15.5px;

    color:var(--text-mute);
}


/* =========================================================
   9. 卡片通用外观
   ========================================================= */

.card{
    position:relative;

    padding:30px;

    border:1px solid var(--line);
    border-radius:var(--radius);

    background:var(--glass);

    backdrop-filter:blur(14px) saturate(1.35);
    -webkit-backdrop-filter:blur(14px) saturate(1.35);

    overflow:hidden;

    transition:transform .35s cubic-bezier(.22,1,.36,1),border-color .35s ease,background .35s ease,box-shadow .35s ease;
}

/* 悬停时顶部亮起一条渐变线 */

.card::before{
    content:"";

    position:absolute;
    top:0;
    left:0;
    right:0;

    height:1px;

    background:linear-gradient(90deg,transparent,var(--accent),transparent);

    opacity:0;

    transition:opacity .4s ease;
}

.card:hover{
    transform:translateY(-4px);

    border-color:var(--line-2);

    background:var(--glass-2);

    box-shadow:var(--shadow);
}

.card:hover::before{
    opacity:1;
}


/* =========================================================
   10. 关于
   ========================================================= */

.about{
    display:grid;

    grid-template-columns:1.55fr 1fr;

    gap:20px;

    align-items:stretch;
}

.about-main p{
    font-size:15.5px;

    color:var(--text-soft);
}

.about-main p + p{
    margin-top:15px;
}

.about-main p strong{
    color:var(--text);
    font-weight:600;
}

/* 右侧小资料表 */

.facts{
    display:flex;
    flex-direction:column;
}

.facts dl{
    /* 让几行资料均匀铺满卡片高度，和左边文字对齐 */
    display:flex;
    flex-direction:column;
    justify-content:space-between;

    flex:1;
}

.facts h3{
    font-size:12px;
    font-weight:600;
    letter-spacing:2.2px;
    text-transform:uppercase;

    color:var(--text-faint);

    margin-bottom:22px;
}

.fact + .fact{
    margin-top:18px;
    padding-top:18px;

    border-top:1px solid var(--line);
}

.fact dt{
    font-size:12px;
    letter-spacing:.6px;

    color:var(--text-faint);

    margin-bottom:3px;
}

.fact dd{
    font-size:14.5px;

    color:var(--text);
}

/* =========================================================
   11. 作品网格
   ========================================================= */

.grid{
    display:grid;

    /* 每张卡最少 300px 宽，浏览器按容器宽度自动决定几列。
       想固定每行几个就换成 grid-template-columns:repeat(2,1fr) */
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));

    gap:20px;
}

.work{
    display:flex;
    flex-direction:column;

    min-height:230px;
}

.work .ico{
    display:grid;
    place-items:center;

    width:46px;
    height:46px;

    margin-bottom:20px;

    font-size:21px;

    border:1px solid var(--line);
    border-radius:13px;

    background:linear-gradient(140deg,rgba(95,208,255,.14),rgba(164,123,255,.1));
}

.work h3{
    font-size:18px;
    font-weight:650;
    letter-spacing:-.3px;

    margin-bottom:9px;
}

.work p{
    font-size:14.5px;

    color:var(--text-mute);
}

.work .meta{
    display:flex;
    flex-wrap:wrap;
    gap:7px;

    margin-top:auto;
    padding-top:22px;
}

.work .meta span{
    padding:3px 10px;

    font-size:11.5px;
    letter-spacing:.3px;

    color:var(--text-faint);

    border:1px solid var(--line);
    border-radius:99px;
}

/* 整块可点的作品卡 */

a.work{
    color:inherit;
}

a.work:hover h3{
    color:var(--accent);
}


/* =========================================================
   12. 联系
   ========================================================= */

.contact{
    text-align:center;

    padding:60px 30px;
}

.contact h2{
    font-size:clamp(26px,4vw,38px);
    font-weight:750;
    letter-spacing:-1px;

    margin-bottom:14px;
}

.contact > p{
    max-width:48ch;

    margin:0 auto 34px;

    font-size:15.5px;

    color:var(--text-mute);
}
.contact .btns{
    justify-content:center;
}

/* 邮箱文字 */

.mailto{
    display:inline-block;

    margin-top:26px;

    font-size:13.5px;
    letter-spacing:.4px;

    color:var(--text-faint);
}

.mailto:hover{
    color:var(--accent);
}


/* =========================================================
   14. 页脚
   ========================================================= */

footer{
    padding:34px 0 44px;

    border-top:1px solid var(--line);
}

.foot{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    align-items:center;
    justify-content:space-between;

    font-size:13px;

    color:var(--text-faint);
}

.foot .up{
    display:inline-flex;
    align-items:center;
    gap:7px;

    transition:color .22s ease;
}

.foot .up:hover{
    color:var(--accent);
}


/* =========================================================
   15. 响应式
   ========================================================= */

@media (max-width:900px){

    .about{
        grid-template-columns:1fr;
    }
}

@media (max-width:640px){

    body{
        font-size:15.5px;
    }

    .wrap{
        padding:0 18px;
    }

    .nav-inner{
        padding:12px 18px;
    }

    /* 手机上收起文字导航，只留 logo */
    .nav ul{
        display:none;
    }

    section{
        padding:72px 0;
    }

    .hero{
        padding-top:104px;
    }

    .card{
        padding:24px 22px;
    }

    .contact{
        padding:48px 22px;
    }

    .btn{
        height:46px;
        padding:0 22px;
    }

    .btns{
        width:100%;
    }

    .btn{
        flex:1 1 auto;
    }
}


/* =========================================================
   17. 动效减弱偏好
   ========================================================= */

@media (prefers-reduced-motion:reduce){

    html{
        scroll-behavior:auto;
    }

    *,
    *::before,
    *::after{
        animation-duration:.001ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.001ms !important;
    }
}

</style>

    <section id="contact">

        <div class="card contact">

            <h2>聊聊？</h2>

            <p>
                有什么事都可以给我发邮件。
            </p>

            <div class="btns">

                <button class="btn primary" id="mail">
                    复制邮箱
                </button>

                <!-- ↓ 想加别的联系方式，照这个格式加一个 -->
                <a class="btn ghost" href="mailto:IT-2307@outlook.com">
                    直接发邮件
                </a>

            </div>

            <a class="mailto" href="mailto:IT-2307@outlook.com" id="mailto">IT-2307@outlook.com</a>

        </div>

    </section>


</main>


<footer>

    <div class="wrap">

        <div class="foot">

            <span>© <span id="year">2026</span> N-LAN</span>

            <a class="up" href="#top">
                回到顶部
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 19V5M6 11l6-6 6 6"/>
                </svg>
            </a>

        </div>

    </div>

</footer>


<script>

/* =========================================================
   1. 邮箱：点按钮复制
   ========================================================= */

const EMAIL = "IT-2307@outlook.com";

const mailBtn = document.getElementById("mail");

mailBtn.addEventListener("click",()=>{

    const done = ()=>{

        const old = mailBtn.textContent;

        mailBtn.textContent = "已复制 ✓";

        setTimeout(()=>{ mailBtn.textContent = old; },1600);
    };

    /* 现代浏览器 */

    if(navigator.clipboard && navigator.clipboard.writeText){

        navigator.clipboard.writeText(EMAIL).then(done).catch(()=>fallback(done));

        return;
    }

    fallback(done);

    /* 老浏览器兜底：临时 textarea + execCommand */

    function fallback(cb){

        const ta = document.createElement("textarea");

        ta.value = EMAIL;
        ta.setAttribute("readonly","");
        ta.style.position = "fixed";
        ta.style.opacity = "0";

        document.body.appendChild(ta);

        ta.select();
        ta.setSelectionRange(0,EMAIL.length);

        try{ document.execCommand("copy"); }catch(e){}

        ta.remove();

        cb();
    }
});


/* =========================================================
   2. 年份
   ========================================================= */

document.getElementById("year").textContent = new Date().getFullYear();


/* =========================================================
   3. 顶部导航：滚动后加玻璃底
   ========================================================= */

const nav = document.getElementById("nav");

function onScroll(){
    nav.classList.toggle("on", window.scrollY > 24);
}

onScroll();

window.addEventListener("scroll",onScroll,{passive:true});


/* =========================================================
   4. 当前区块高亮
   ========================================================= */

const navLinks = [...document.querySelectorAll("[data-nav]")];

const sections = navLinks
    .map(a => document.querySelector(a.getAttribute("href")))
    .filter(Boolean);

const spy = new IntersectionObserver(entries=>{

    entries.forEach(e=>{

        if(!e.isIntersecting) return;

        navLinks.forEach(a=>{
            a.classList.toggle("active", a.getAttribute("href") === "#" + e.target.id);
        });
    });

},{ rootMargin:"-45% 0px -50% 0px" });

sections.forEach(s => spy.observe(s));


/* =========================================================
   5. 打字机
   ---------------------------------------------------------
   HTML 里已经写好了第一句，这里从它接着往下打，
   这样即使脚本有延迟，也不会出现一段空白。
   ========================================================= */

(function typewriter(){

    const box = document.querySelector(".typed");
    const out = box && box.querySelector(".typed-out");

    if(!box || !out) return;

    const lines = box.dataset.text.split(",").map(s => s.trim()).filter(Boolean);

    /* 动效减弱偏好下不逐字打，直接显示第一句 */

    if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){

        out.textContent = lines[0] || "";

        return;
    }

    let li = 0;                       /* 第几句 */
    let ci = out.textContent.length;  /* 已经从 HTML 里显示了多少字 */
    let del = false;

    function tick(){

        const line = lines[li] || "";

        if(!del){

            ci++;

            out.textContent = line.slice(0,ci);

            if(ci >= line.length){

                del = true;

                setTimeout(tick,1800);      /* 打完停一下 */

                return;
            }

            setTimeout(tick,90);

        }else{

            ci--;

            out.textContent = line.slice(0,ci);

            if(ci <= 0){

                del = false;
                li = (li + 1) % lines.length;

                setTimeout(tick,320);

                return;
            }

            setTimeout(tick,38);
        }
    }

    setTimeout(tick,600);

})();


/* =========================================================
   7. 平滑滚动（兼容不支持 scroll-behavior 的情况）
   ========================================================= */

document.querySelectorAll('a[href^="#"]').forEach(a=>{

    a.addEventListener("click",e=>{

        const id = a.getAttribute("href");

        if(id === "#") return;

        const target = document.querySelector(id);

        if(!target) return;

        e.preventDefault();

        target.scrollIntoView({
            behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth",
            block:"start"
        });

        /* 让地址栏也跟着更新，但不要跳一下 */

        history.replaceState(null,"",id);
    });
});

</script>

</body>
</html>
