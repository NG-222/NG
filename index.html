<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>N-LAN</title>
<meta name="description" content="N-LAN 的个人主页">
<meta name="author" content="N-LAN">
<meta name="theme-color" content="#0b0f17">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%2362c8ff' stroke-width='2'/%3E%3C/svg%3E">

<style>

/* =====================================================
   基础
   ===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --accent:#62c8ff;

    --text:#ffffff;
    --text-soft:rgba(232,240,252,.74);
    --text-mute:rgba(232,240,252,.5);
    --text-faint:rgba(232,240,252,.34);

    --line:rgba(255,255,255,.12);
    --fill:rgba(255,255,255,.05);
    --fill-hover:rgba(255,255,255,.1);
}

body{
    min-height:100vh;

    padding:56px 20px 72px;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Hiragino Sans GB",
        "Microsoft YaHei",
        system-ui,
        sans-serif;

    font-size:15px;
    line-height:1.8;

    color:var(--text);

    background:
        radial-gradient(800px 600px at 15% 8%, rgba(30,120,200,.2), transparent 70%),
        radial-gradient(700px 520px at 92% 16%, rgba(120,90,220,.16), transparent 70%),
        radial-gradient(800px 600px at 70% 100%, rgba(40,170,170,.12), transparent 72%),
        #0b0f17;

    -webkit-font-smoothing:antialiased;
}

a{
    color:var(--accent);
    text-decoration:none;
}

a:hover{
    text-decoration:underline;
}

::selection{
    background:rgba(98,200,255,.3);
}


/* =====================================================
   页面容器：一列居中的卡片
   ===================================================== */

.wrap{
    width:100%;
    max-width:600px;
    margin:0 auto;
}

.card{
    padding:40px;

    border:1px solid var(--line);
    border-radius:20px;

    background:rgba(255,255,255,.045);

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
}

.card + .card{
    margin-top:20px;
}


/* =====================================================
   首页
   ===================================================== */

h1{
    font-size:34px;
    font-weight:800;
    letter-spacing:-1px;
    line-height:1.25;

    margin-bottom:6px;
}

h1 em{
    font-style:normal;
    color:var(--accent);
}

.sub{
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--text-mute);

    margin-bottom:26px;
}

p{
    color:var(--text-soft);
}

p + p{
    margin-top:12px;
}


/* =====================================================
   链接按钮
   ===================================================== */

.links{
    display:flex;
    flex-wrap:wrap;
    gap:10px;

    margin-top:28px;
    padding-top:24px;

    border-top:1px solid var(--line);
}

.links a,
.links button{
    display:inline-flex;
    align-items:center;
    gap:6px;

    height:40px;
    padding:0 18px;

    border:1px solid var(--line);
    border-radius:99px;

    background:var(--fill);
    color:var(--text-soft);

    font-family:inherit;
    font-size:14px;

    cursor:pointer;

    transition:background .2s ease,color .2s ease;
}

.links a:hover,
.links button:hover{
    background:var(--fill-hover);
    color:var(--text);
    text-decoration:none;
}

.foot{
    font-size:12px;
    color:var(--text-faint);
}

.card.foot-card{
    padding:20px 40px;
}


/* =====================================================
   手机
   ===================================================== */

@media (max-width:520px){

    body{
        padding:32px 14px 48px;
    }

    .card{
        padding:26px 22px;
    }

    .card.foot-card{
        padding:16px 22px;
    }

    h1{
        font-size:27px;
    }
}

</style>
</head>

<body>

<div class="wrap">


    <!-- =====================================================
         首页
         ===================================================== -->

    <div class="card">

        <h1>你好，我是 <em>N-LAN</em></h1>

        <div class="sub">Personal Page</div>

        <p>一个喜欢把界面做得好看一点的开发者。</p>

        <p>写代码、听音乐、打游戏，偶尔把一些想法写下来。</p>

        <div class="links">

            <button id="mail">复制邮箱</button>

            <!-- ↓ 想加链接就照这个格式加一行，把 # 换成网址
            <a href="#" target="_blank" rel="noopener">GitHub</a>
            -->

        </div>

    </div>


    <!-- =====================================================
         页脚
         ===================================================== -->

    <div class="card foot-card">

        <div class="foot">© <span id="year">2026</span> N-LAN</div>

    </div>


</div>


<script>

/* 复制邮箱 */

const EMAIL = "IT-2307@outlook.com";

document.getElementById("mail").addEventListener("click",function(){

    const btn = this;
    const done = ()=>{
        btn.textContent = "已复制";
        setTimeout(()=>{ btn.textContent = "复制邮箱"; },1500);
    };

    if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(EMAIL).then(done);
        return;
    }

    /* 老浏览器兜底 */

    const ta = document.createElement("textarea");

    ta.value = EMAIL;
    document.body.appendChild(ta);
    ta.select();

    document.execCommand("copy");
    ta.remove();

    done();
});

/* 年份 */

document.getElementById("year").textContent = new Date().getFullYear();

</script>

</body>
</html>
